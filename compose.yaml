services:
  postgres:
    image: postgres:17
    container_name: argus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ARGUS_DB_NAME:-argus}
      POSTGRES_USER: ${ARGUS_DB_ADMIN_USER:-argus_admin}
      POSTGRES_PASSWORD: ${ARGUS_DB_ADMIN_PASSWORD:-REDACTED_FORMER_DEV_PLACEHOLDER}
    ports:
      - "${ARGUS_DB_PORT:-5432}:5432"
    volumes:
      - argus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARGUS_DB_ADMIN_USER:-argus_admin} -d ${ARGUS_DB_NAME:-argus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argus_api
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "argus.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      ARGUS_DB_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  argus_postgres_data:
