services:
  postgres:
    image: postgres:17
    container_name: argus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ARGUS_DB_NAME:-argus}
      POSTGRES_USER: ${ARGUS_DB_ADMIN_USER:-argus_admin}
      # No fallback password (SEC-005 / section 108): Compose refuses to start
      # rather than silently using a working default. Set ARGUS_DB_ADMIN_PASSWORD
      # in your local .env (gitignored; see .env.example) before running this.
      POSTGRES_PASSWORD: ${ARGUS_DB_ADMIN_PASSWORD:?ARGUS_DB_ADMIN_PASSWORD must be set in .env — see .env.example. No fallback password is provided.}
    ports:
      - "${ARGUS_DB_PORT:-5432}:5432"
    volumes:
      - argus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARGUS_DB_ADMIN_USER:-argus_admin} -d ${ARGUS_DB_NAME:-argus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argus_api
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "argus.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      ARGUS_DB_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # FSR-01 (argus-final-spec-recovery-001): the distinct, least-privilege
  # executor process -- structurally separate from `api` above. Connects
  # as `argus_executor` (never `argus_admin`/`argus_ingest`/`argus_research`),
  # exposes NO inbound port (nothing calls into it), and is the only
  # service with the operator secrets mount below (read-only; the host
  # directory it points at, and everything under it -- including the
  # signing key and arm file -- must be provisioned OUTSIDE this repo by
  # the operator; neither is ever created, generated, or committed by
  # this codebase, MASTER_SPEC.md section 70/73). Gated behind the
  # `executor` Compose profile so a plain `docker compose up`/`make up`
  # never starts it -- only `docker compose --profile executor up` does,
  # an explicit operator decision this codebase never makes automatically.
  executor:
    profiles: ["executor"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argus_executor
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "argus.executor.main"]
    env_file:
      - .env
    environment:
      ARGUS_DB_HOST: postgres
    volumes:
      - ${ARGUS_EXECUTOR_HOST_SECRETS_DIR:?set to an operator-provisioned host directory before using the executor profile}:/var/lib/argus/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  argus_postgres_data:
