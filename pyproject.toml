[project]
name = "argus"
version = "0.1.0"
description = "ARGUS — Solana wallet intelligence, copyability research, Alpha-Ancestry graph, synthetic trader, and isolated execution engine."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "pyyaml>=6.0,<7.0",
  "structlog>=24.1,<25.0",
  "httpx>=0.27,<1.0",
  "websockets>=12.0,<13.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.7,<14.0",
  "scikit-learn>=1.4,<2.0",
]

[project.scripts]
argus = "argus.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<6.0",
  "hypothesis>=6.100,<7.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
  "types-pyyaml>=6.0,<7.0",
  "asgi-lifespan>=2.1,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["src/argus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["argus"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
